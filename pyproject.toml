[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "searx-corpus-studio"
version = "1.0.0"
description = "SearXNG-powered web search, crawler, Markdown archive, searchable library, and LLM corpus builder."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "requests==2.32.5",
  "trafilatura==2.0.0",
  "beautifulsoup4==4.13.5",
  "jinja2==3.1.6",
  "python-multipart==0.0.20",
]

[project.scripts]
searx-corpus = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
